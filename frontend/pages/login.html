<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="/frontend/css/register.css">
    <title>BudgetPlanner</title>
</head>
<body>
    <main>
        <section class="welcome-section">
            <!-- Section where the image is the left side of the screen -->
            <div class="brand">
                <h1>BudgetTracker</h1>
            </div>
            <div class="welcome-image">
                <img src="/frontend/assets/Graph-login.jpg" alt="image on a graph">
            </div>
            <div class="welcome-text">
                <p>BudgetTracker is a free to use website for tracking and managing your income. Create budgets and get notifications on when
                    your budget exeeds its limit. Save more by using BudgetTracker.
                </p>
            </div>
       
        </section>

        <!-- Section on the right hand side where the user log in or register -->
         <section class="login-section">
            <form>
                <h2>Get started with BudgetTracker</h2>
                <p>Try BudgetTracker for free</p>

                <div class="social-btn">
                    <button>Continue with Google <i class="fa-brands fa-google"></i></button>
                    <button>Continue with Apple <i class="fa-brands fa-apple"></i></button>
                </div>
                

                <hr>
                <h3>Sign In</h3>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="password">password</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Log In</button>
                <a href="/frontend/pages/register.html">Create Account</a>
            </form>
         </section>
        
    </main>
    
</body>
</html>
